name: Publish Android release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag and signing secrets
        id: release
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a release tag in vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          for secret_name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Required signing secret is missing: $secret_name" >&2
              exit 1
            fi
          done

          version="${GITHUB_REF_NAME#v}"
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

          keystore_path="$RUNNER_TEMP/lifeisshort-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Run tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Assemble signed release APK
        env:
          APP_VERSION_NAME: ${{ steps.release.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.release.outputs.version_code }}
          RELEASE_STORE_FILE: ${{ steps.release.outputs.keystore_path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare APK and checksum
        id: artifact
        env:
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          release_apk="LifeIsShort-${VERSION_NAME}.apk"
          cp "$apk" "$release_apk"
          sha256sum "$release_apk" > "$release_apk.sha256"
          echo "apk_path=$release_apk" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$release_apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature and checksum
        env:
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.artifact.outputs.checksum_path }}
        run: |
          set -euo pipefail
          apksigner=""
          for candidate in "$ANDROID_HOME"/build-tools/*/apksigner; do
            if [[ -x "$candidate" ]]; then
              apksigner="$candidate"
            fi
          done
          if [[ -z "$apksigner" ]]; then
            echo "Android SDK build-tools apksigner was not found." >&2
            exit 1
          fi
          "$apksigner" verify --verbose "$APK_PATH"
          sha256sum --check "$CHECKSUM_PATH"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.artifact.outputs.checksum_path }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" "$CHECKSUM_PATH" \
            --title "LifeIsShort ${VERSION_NAME}" \
            --generate-notes
