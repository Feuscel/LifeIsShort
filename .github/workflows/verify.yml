name: Android verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build app and instrumentation test APK
        run: ./gradlew lintDebug assembleDebug assembleDebugAndroidTest
