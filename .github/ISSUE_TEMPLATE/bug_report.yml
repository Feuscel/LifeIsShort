name: Bug report
description: Report a reproducible problem with LifeIsShort.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please do not include private messages, account details, or screenshots containing personal information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Enable... 2. Open... 3. Observe..."
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: LifeIsShort version
      placeholder: "For example, 1.0 (1) or a commit ID"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version and device
    validations:
      required: true
  - type: input
    id: instagram-version
    attributes:
      label: Instagram version
      description: Include this if the issue involves screen detection.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I have removed private or identifying content from any details I share.
          required: true
